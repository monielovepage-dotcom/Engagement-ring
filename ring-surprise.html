<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>ขอหมั้นไว้ก่อน จองตัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: one full-screen stage, six scenes that cross-fade. Luxury jewelry-ad look: milk and ivory ground, blush glow, crimson velvet box, silver ring. */
:root{
  --milk:#FFFCFC;--ivory:#FFF8F2;--blush:#F7E3EA;--rose:#E6B4C3;--champ:#D8C2A0;--silver:#D8DCE2;--ink:#49363D;
  --ink-soft:rgba(73,54,61,.72);--rose-deep:#B5657E;
  --velvet:#9E1B32;--velvet-lt:#C8344D;--velvet-dk:#560C1A;
  --display:'Noto Serif Thai',Georgia,serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --latin:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.4,.1,.2,1);
  --k:1;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--milk);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;width:100%;overflow:hidden;
  background:
    radial-gradient(70% 48% at 50% 36%,rgba(247,227,234,.95),rgba(247,227,234,0) 72%),
    radial-gradient(120% 60% at 50% 110%,rgba(230,180,195,.28),rgba(230,180,195,0) 70%),
    linear-gradient(180deg,var(--milk),var(--ivory));
}

/* scenes */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vh,20px);padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  text-align:center;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .9s ease,visibility 0s linear .9s}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s ease,visibility 0s}

h1,h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,6.2vw,32px);line-height:1.6;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.sub{font-weight:300;font-size:clamp(16px,4.4vw,19px);line-height:1.7;color:var(--ink-soft)}
.line{opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s var(--ease)}
.line.show{opacity:1;transform:none}
.big{font-family:var(--display);font-weight:300;font-size:clamp(24px,6.8vw,36px);line-height:1.55}

/* buttons */
.btn{appearance:none;border:1px solid transparent;cursor:pointer;min-height:56px;padding:0 34px;border-radius:999px;
  font-size:17px;font-weight:500;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),opacity .6s ease,visibility 0s}
.btn:active{transform:scale(.97)}
.btn.primary{color:var(--ink);background:linear-gradient(180deg,#FBE9EF,var(--rose));border-color:rgba(216,194,160,.9);
  box-shadow:0 10px 26px -10px rgba(181,101,126,.55),inset 0 1px 0 rgba(255,255,255,.85)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.72);border-color:var(--silver);
  box-shadow:0 8px 20px -12px rgba(73,54,61,.35),inset 0 1px 0 #fff}
.btn:focus-visible,.box-hit:focus-visible,.snd:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
.btn.late{opacity:0;visibility:hidden;pointer-events:none}
.btn.late.show{opacity:1;visibility:visible;pointer-events:auto}

.actions{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;width:min(100%,420px);grid-area:1/1;align-self:center;justify-self:center;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s ease,visibility 0s linear .8s}
.actions.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .8s ease,visibility 0s}
.actions .btn{flex:1 1 150px;padding:0 18px}
.act-wrap{display:grid;width:100%;justify-items:center}
@media (min-width:640px){.actions{width:auto}.actions .btn{flex:0 0 auto;min-width:200px}}

/* sound toggle */
.snd{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));right:12px;min-height:44px;padding:0 16px;border-radius:999px;
  border:1px solid var(--silver);background:rgba(255,255,255,.78);font-size:14px;font-weight:400;cursor:pointer;color:var(--ink-soft)}

/* ---------- Scene one: 3D ring box ---------- */
.box-holder{position:relative;width:calc(300px*var(--k));height:calc(320px*var(--k));flex:none}
.box-scale{position:absolute;left:50%;top:50%;width:300px;height:320px;margin:-160px 0 0 -150px;
  transform:scale(var(--k));transition:transform 2.6s cubic-bezier(.45,.05,.2,1)}
.box-holder.zoom .box-scale{transform:scale(calc(var(--k)*1.75)) translateY(4%)}
.plinth{position:absolute;left:50%;top:232px;width:290px;height:70px;margin-left:-145px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#fff 0%,#FBEFF2 55%,#EBD3DA 100%);
  box-shadow:0 26px 34px -14px rgba(73,54,61,.38),inset 0 -6px 12px rgba(181,101,126,.18)}
.plinth::after{content:"";position:absolute;inset:10px 24px 22px;border-radius:50%;border:1px solid rgba(216,194,160,.7)}
.spot{position:absolute;left:50%;top:-30px;width:340px;height:300px;margin-left:-170px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,0) 68%)}
.persp{position:absolute;inset:0;perspective:900px;perspective-origin:50% 30%}
.box3d{position:absolute;left:50%;top:224px;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-26deg) rotateY(-18deg)}
.box3d.nudge{animation:nudge .6s var(--ease)}
@keyframes nudge{0%,100%{transform:rotateX(-26deg) rotateY(-18deg) scale(1)}40%{transform:rotateX(-24deg) rotateY(-16deg) scale(.965)}}
.f{position:absolute}
.vel{background-color:var(--velvet);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.3px),radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.3px);background-size:4px 4px,5px 5px;background-position:0 0,2px 2px}
.bf{left:-110px;top:-40px;width:220px;height:80px}
.bf.front{transform:translateZ(80px);background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.28)),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.bf.back{transform:rotateY(180deg) translateZ(80px)}
.bs{left:-80px;top:-40px;width:160px;height:80px}
.bs.right{transform:rotateY(90deg) translateZ(110px);filter:brightness(.78)}
.bs.left{transform:rotateY(-90deg) translateZ(110px);filter:brightness(.62)}
.bbot{left:-110px;top:-80px;width:220px;height:160px;transform:rotateX(-90deg) translateZ(40px);background:var(--velvet-dk)}
.rim{left:-110px;top:-80px;width:220px;height:160px;transform:rotateX(90deg) translateZ(40px);border:14px solid var(--velvet-lt);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 0 12px rgba(0,0,0,.35)}
.cushion{left:-96px;top:-66px;width:192px;height:132px;transform:rotateX(90deg) translateZ(24px);
  background:radial-gradient(ellipse at 50% 40%,#D44360,#8A1A2E 72%)}
.slit{position:absolute;left:14%;right:14%;top:50%;height:9px;margin-top:-4px;border-radius:9px;background:linear-gradient(#2a0509,#4A0A16);
  box-shadow:0 1px 0 rgba(255,255,255,.2),inset 0 2px 3px rgba(0,0,0,.55)}
.trim{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#E9D8BA,#C9AE82 40%,#F1E4C8 60%,#C9AE82)}
.pivot{position:absolute;left:0;top:-40px;width:0;height:0;transform-style:preserve-3d;transform:translateZ(-80px) rotateX(0deg);
  transition:transform 2.3s cubic-bezier(.32,.08,.2,1)}
.box3d.open .pivot{transform:translateZ(-80px) rotateX(108deg)}
.lid{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateZ(80px) translateY(-21px)}
.lf{left:-110px;top:-21px;width:220px;height:42px}
.lf.front{transform:translateZ(80px);background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.22)),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.lf.back{transform:rotateY(180deg) translateZ(80px)}
.ls{left:-80px;top:-21px;width:160px;height:42px}
.ls.right{transform:rotateY(90deg) translateZ(110px);filter:brightness(.78)}
.ls.left{transform:rotateY(-90deg) translateZ(110px);filter:brightness(.62)}
.ltop{left:-110px;top:-80px;width:220px;height:160px;transform:rotateX(90deg) translateZ(21px);background-color:var(--velvet-lt);
  background-image:radial-gradient(ellipse at 38% 30%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px);background-size:100% 100%,4px 4px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.linner{left:-110px;top:-80px;width:220px;height:160px;transform:rotateX(-90deg) translateZ(21px);
  background:linear-gradient(180deg,#FFF8F2,#EAD8C6);box-shadow:inset 0 0 0 7px #F6EBDD,inset 0 0 0 8px rgba(201,174,130,.8)}
.clasp{position:absolute;left:50%;bottom:-13px;width:28px;height:22px;margin-left:-14px;border-radius:0 0 9px 9px;
  background:linear-gradient(90deg,#E9D8BA,#C9AE82 45%,#F1E4C8);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.glow{position:absolute;left:50%;top:92px;width:260px;height:190px;margin-left:-130px;pointer-events:none;opacity:0;transform:scale(.6);
  background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.98),rgba(250,225,235,.65) 38%,rgba(247,227,234,0) 70%);
  transition:opacity 1.6s ease,transform 2.4s var(--ease)}
.box3d.open ~ .glow,.box-holder.opened .glow{opacity:1;transform:scale(1)}
.box-ring{position:absolute;left:50%;top:118px;width:112px;margin-left:-56px;opacity:0;transform:translateY(26px);
  clip-path:inset(0 0 31% 0);transition:opacity 1.2s ease,transform 1.8s var(--ease)}
.box-holder.opened .box-ring{opacity:1;transform:translateY(0)}
.box-hit{position:absolute;left:50%;top:40px;width:250px;height:230px;margin-left:-125px;background:transparent;border:0;cursor:pointer;border-radius:24px}
.box-holder.zoom .box-hit,.box-holder.opened .box-hit{pointer-events:none}
.spark-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}

.spark{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0,#fff 35%,rgba(255,244,248,.0) 72%);opacity:0;animation:spark var(--d,1.6s) ease-out forwards}
.spark.star{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:0;
  background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--tx,0),var(--ty,-80px)) scale(1)}}

/* ---------- Scene two: the ring ---------- */
.ring-stage{position:relative;width:calc(280px*var(--k));height:calc(300px*var(--k));perspective:900px;flex:none}
.ring-hero{position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.4s ease,transform 2.4s var(--ease)}
#sc-ring.active .ring-hero,#sc-ring.in .ring-hero{opacity:1;transform:none}
.ring-sway{position:absolute;inset:0;animation:sway 9s ease-in-out infinite;transform-style:preserve-3d}
@keyframes sway{0%,100%{transform:rotateY(-15deg) rotateZ(-1.5deg) translateY(0)}50%{transform:rotateY(15deg) rotateZ(1.5deg) translateY(-6px)}}
.ring-ground{position:absolute;left:50%;bottom:0;width:62%;height:16px;margin-left:-31%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(73,54,61,.28),rgba(73,54,61,0) 70%);animation:ground 9s ease-in-out infinite}
@keyframes ground{0%,100%{transform:scale(1)}50%{transform:scale(.88);opacity:.8}}
.ring-art svg,.hand-art svg{display:block;width:100%;height:auto;overflow:visible}
.sweep{animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-70px) skewX(-20deg)}100%{transform:translateX(250px) skewX(-20deg)}}
.glint{transform-box:fill-box;transform-origin:center;opacity:0;animation:glint 4.8s ease-in-out infinite}
.glint.g2{animation-delay:1.9s}.glint.g3{animation-delay:3.2s}
@keyframes glint{0%,70%,100%{opacity:0;transform:scale(.3) rotate(0)}82%{opacity:1;transform:scale(1) rotate(45deg)}92%{opacity:0;transform:scale(.5) rotate(90deg)}}
.ring-lines{display:flex;flex-direction:column;gap:6px;min-height:124px;justify-content:center}

/* ---------- Scene three: try-on. Five large fingers (left hand, back view) rise from the bottom; the ring is slid over the ring finger. ---------- */
#sc-try{justify-content:flex-start;gap:clamp(6px,1.4vh,14px);padding-top:max(64px,calc(env(safe-area-inset-top) + 56px))}
.say{display:grid;width:100%;justify-items:center;align-items:center;min-height:5.6em;flex:none;position:relative;z-index:6}
.say .big{font-size:clamp(22px,6vw,30px)}
.grp{grid-area:1/1;display:flex;flex-direction:column;gap:2px;align-items:center;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
.grp.show{opacity:1;visibility:visible;transition:opacity .8s ease,visibility 0s}
.fz{position:relative;flex:1 1 0;width:100%;min-height:0;display:flex;justify-content:center;align-items:flex-end}
.finger-holder{position:relative;height:100%;aspect-ratio:420/520;max-width:100%;transform-origin:50% 100%;transition:transform 2s var(--ease)}
@supports (width:1cqw){.fz{container-type:size}.finger-holder{height:auto;width:min(100cqw,calc(100cqh*420/520))}}
.finger-holder.pose{transform:translateY(-6px)}
.finger-holder.zoom{transform:scale(1.15)}
.finger-art{position:absolute;inset:0;filter:drop-shadow(0 16px 18px rgba(120,70,70,.14))}
.fs{--rx:114px;--ry:44px;--rs:1;--tilt:1.7;position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.fs.static{--ry:380px;--tilt:1}
#sc-try.active .fs{animation:rise 1.5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
/* the ring: position, tilt of its band (seen more from above while it hovers) and the stone riding on the front of the band */
.fs .rp{transform:translate(var(--rx),var(--ry)) scale(var(--rs));transition:transform var(--t,1.4s) var(--ease),opacity .6s ease}
.fs .arc{transform:scaleY(var(--tilt));transition:transform var(--t,1.4s) var(--ease)}
.fs .gem,.fs .pv{transform:translateY(calc(var(--tilt)*var(--dy,11px)));transition:transform var(--t,1.4s) var(--ease)}
.fs.snap .rp,.fs.snap .arc,.fs.snap .gem,.fs.snap .pv{transition:none}
.fs.hide .rp{opacity:0}
.fs .ab2{display:none}
.fs.front .ab2{display:inline}
.fs.front .ab,.fs.front .sh{display:none}
.rb{animation:bob 3.6s ease-in-out infinite}
.fs.moving .rb,.fs.static .rb{animation:none}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
.gsweep{animation:gsweep 4.6s ease-in-out infinite}
@keyframes gsweep{0%,55%{transform:translateX(-18px) skewX(-20deg)}100%{transform:translateX(34px) skewX(-20deg)}}
.flash{position:absolute;pointer-events:none;width:calc(150px*var(--k));height:calc(150px*var(--k));border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(250,225,235,.5) 40%,rgba(255,255,255,0) 70%)}
.flash.go{animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.slot{position:absolute;left:50%;bottom:0;width:calc(150px*var(--k));height:calc(81px*var(--k));margin-left:calc(-75px*var(--k));z-index:2;opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s var(--ease)}
.slot.show{opacity:1;transform:none}
.slot>svg{display:block;width:100%;height:100%;overflow:visible}
.box-ring-in{opacity:0;transition:opacity .6s ease}
.box-ring-in.show,.always-ring .box-ring-in{opacity:1}
.noanim,.noanim *{transition:none!important;animation:none!important}

/* certificate */
.cert-layer{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:20px;
  background:rgba(255,252,252,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.cert-layer.show{opacity:1;visibility:visible;transition:opacity 1s ease,visibility 0s}
.cert{position:relative;width:min(100%,360px);padding:30px 26px 28px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(160deg,#fff,var(--ivory) 55%,var(--blush));border:1px solid var(--silver);
  box-shadow:0 30px 50px -28px rgba(73,54,61,.45),0 2px 0 #fff inset;opacity:0;transform:scale(.94) translateY(10px);
  transition:opacity 1.1s ease .15s,transform 1.4s var(--ease) .15s}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid rgba(216,220,226,.95);border-radius:3px;pointer-events:none}
.cert::after{content:"";position:absolute;inset:12px;border:1px solid rgba(230,180,195,.45);border-radius:2px;pointer-events:none}
.cert-layer.show .cert{opacity:1;transform:none}
.cert.leave{opacity:0!important;transform:scale(.6) translateY(-6px)!important;transition:opacity 1.2s ease,transform 1.2s var(--ease)!important}
.cert-gem{width:34px;height:31px}
.cert h2{font-size:26px;line-height:1.5}
.rule{width:62%;height:1px;background:linear-gradient(90deg,rgba(216,220,226,0),var(--silver),rgba(216,220,226,0))}
.cert .status{font-weight:500;font-size:18px;line-height:1.6}
.cert .note{font-weight:300;font-size:16px;line-height:1.75;color:var(--ink-soft)}
.stamp{margin-top:6px;padding:6px 12px;border:2px solid var(--rose-deep);border-radius:5px;color:var(--rose-deep);transform:rotate(-8deg) scale(1.7);opacity:0;
  font-family:var(--latin);font-style:italic;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px rgba(181,101,126,.5);transition:opacity .5s ease 1.2s,transform .7s var(--ease) 1.2s}
.cert-layer.show .stamp{opacity:.9;transform:rotate(-8deg) scale(1)}
.cert .btn{margin-top:8px;width:100%}

/* ---------- Final ---------- */
#sc-final{background:radial-gradient(60% 44% at 50% 40%,rgba(247,227,234,.9),rgba(247,227,234,0) 75%)}
.final-art{position:relative;width:calc(220px*var(--k));height:calc(250px*var(--k));flex:none;display:grid;place-items:center;opacity:0;transform:scale(.96);transition:opacity 1.6s ease,transform 2s var(--ease)}
.final-art.show{opacity:1;transform:none}
.final-art .finger-art{position:relative;z-index:1;inset:auto;width:calc(200px*var(--k));aspect-ratio:420/520;animation:rest 6s ease-in-out infinite}
.final-art .box-wrap{position:relative;z-index:1;width:100%}
.box-wrap>svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes rest{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.halo{position:absolute;z-index:0;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(247,227,234,.95),rgba(247,227,234,0) 66%);animation:halo 6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.fp{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(230,180,195,.7) 60%,rgba(230,180,195,0));opacity:0;animation:fp var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes fp{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-34vh)}}
.fp-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.finale{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}
.finale .big{font-size:clamp(20px,5.4vw,32px)}
.replay{margin-top:6px;min-height:48px;padding:0 24px;font-size:15px}

@media (max-width:520px){#actDecl .btn{flex-basis:100%}}
@media (max-height:640px){.sub{font-size:15px}.btn{min-height:52px}}
@media (prefers-reduced-motion:reduce){
  .ring-sway,.ring-ground,.sweep,.gsweep,.glint,.rb,.halo,.fp,.final-art .finger-art,#sc-try.active .fs{animation:none!important}
  .scene,.scene.active{transition-duration:.01s!important}
  .box-scale,.pivot,.fs .rp,.fs .arc,.fs .gem,.fs .pv,.finger-holder{transition-duration:.01s!important}
  .glint{opacity:.9;transform:none}
  .spark{display:none}
}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="silverBand" x1="0" y1="0" x2="1" y2="1">

<script>
/* ================================================================

   ================================================================ */
const CONFIG = {

  /* scene 2: the ring */

  ringReveal: "ขอจองตัวไว้ก่อนได้ไหม 💍",

  reservationStatus: "สถานะ: คนพิเศษที่ถูกจองไว้ก่อน",

  declineLine2: "ค่อยสวมในวันที่พร้อมก็ได้นะ",

  continueText: "ไปต่อโดยไม่สวมแหวน",

  /* final */
  finalTitle: "ขอจองไว้ในอนาคตนะ 🤍",
  finalLine1: "วันนี้อาจเป็นแค่การลองสวมแหวน",
  finalLine2: "แต่ความรู้สึกดี ๆ ที่มีให้ อยากเก็บไว้ให้นานกว่าวันนี้",
  finalClosing: "ไว้ค่อย ๆ เติบโตไปด้วยกันนะ 💗",

  /* sound (off by default; the visitor turns it on) */

  showSoundToggle: true,
  backgroundMusic: "",         // optional URL to a soft looping track; plays only after sound is turned on

  /* replaceable artwork. Leave "" to use the built-in SVG illustrations. */

/* ================================================================
   Built-in artwork
   ================================================================ */
function ringInner(anim){
  const star = (c, x, y, s) => anim
    ? `<g transform="translate(${x} ${y}) scale(${s})"><path class="glint ${c}" d="M0,-13 Q1.6,-1.6 13,0 Q1.6,1.6 0,13 Q-1.6,1.6 -13,0 Q-1.6,-1.6 0,-13Z" fill="#fff"/></g>` : '';
  const pave = [[-30.7,139,3.8],[-45.9,147,3.4],[-59,158,3],[30.7,139,3.8],[45.9,147,3.4],[59,158,3]]
    .map(([dx,y,r]) => `<circle cx="${150+dx}" cy="${y}" r="${r}" fill="url(#dg1)" stroke="#A9B6C9" stroke-width=".6"/><circle cx="${150+dx-r*.3}" cy="${y-r*.3}" r="${r*.28}" fill="#fff"/>`).join('');
  return `
  <circle cx="150" cy="215" r="82" fill="none" stroke="url(#silverBand)" stroke-width="20"/>
  <circle cx="150" cy="215" r="92" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1"/>
  <circle cx="150" cy="215" r="72" fill="none" stroke="#7F8896" stroke-opacity=".5" stroke-width="1.4"/>
  <path d="M67.3,245.1 A88,88 0 0 1 73.8,171" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
  <path d="M217.4,271.6 A88,88 0 0 1 180.1,297.7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  ${pave}
  <path d="M112,120 Q150,138 188,120 L182,98 Q150,112 118,98 Z" fill="url(#silverBand)" stroke="#9AA3B0" stroke-width=".7"/>
  <use href="#diamondSym" x="100" y="36" width="100" height="92"/>
  <g clip-path="url(#dClip)"><rect${anim?' class="sweep"':' display="none"'} x="60" y="30" width="34" height="110" fill="url(#sweepG)"/></g>
  <path d="M118,112 C108,96 104,82 108,64" fill="none" stroke="#9AA3B0" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M118,112 C108,96 104,82 108,64" fill="none" stroke="#EDF0F4" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M182,112 C192,96 196,82 192,64" fill="none" stroke="#9AA3B0" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M182,112 C192,96 196,82 192,64" fill="none" stroke="#EDF0F4" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="108" cy="63" r="3.6" fill="#F3F5F8" stroke="#A3ACB8" stroke-width=".6"/>
  <circle cx="192" cy="63" r="3.6" fill="#F3F5F8" stroke="#A3ACB8" stroke-width=".6"/>
  ${star('g1',128,52,1)}${star('g2',177,70,.8)}${star('g3',72,172,.6)}`;
}
const ringSVG = anim => `<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="แหวนเพชรเงิน">${ringInner(anim)}</svg>`;

/* Top-down brilliant cut, used for the diamond when the ring is worn (the stone faces the viewer). */
function gemTop(cx, cy, R){
  const ang = i => Math.PI / 8 + i * Math.PI / 4;
  const P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const outer = [...Array(8)].map((_, i) => P(R, ang(i)));
  const table = [...Array(8)].map((_, i) => P(R * .5, ang(i)));
  const fill = ['dg1','dg4','dg3','dg2','dg5','dg1','dg3','dg4'];
  const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  let s = `<circle cx="${cx}" cy="${cy}" r="${R + 5}" fill="url(#silverBand)" stroke="#9AA3B0" stroke-width=".7"/>`;
  for (let i = 0; i < 8; i++){ const j = (i + 1) % 8;
    s += `<polygon points="${pts([table[i], outer[i], outer[j], table[j]])}" fill="url(#${fill[i]})"/>`; }
  s += `<polygon points="${pts(table)}" fill="url(#dg1)"/>`;
  s += `<path d="${table.map((p, i) => `M${p[0].toFixed(1)},${p[1].toFixed(1)}L${outer[i][0].toFixed(1)},${outer[i][1].toFixed(1)}`).join('')}" stroke="#9FB2CC" stroke-opacity=".55" stroke-width=".6" fill="none"/>`;
  s += `<polygon points="${pts(table)}" fill="none" stroke="#9FB2CC" stroke-opacity=".5" stroke-width=".6"/>`;
  s += `<polygon points="${pts(outer)}" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".9"/>`;
  for (let i = 0; i < 8; i += 2) s += `<circle cx="${outer[i][0].toFixed(1)}" cy="${outer[i][1].toFixed(1)}" r="3.3" fill="#EDF0F4" stroke="#A3ACB8" stroke-width=".6"/>`;
  return { markup: s, clip: pts(outer) };
}

/* Five large fingers of a left hand (back of the hand toward the viewer, thumb on the right), rising from the bottom and fading out.
   The ring finger is the second from the left. The ring is built from separate layers so a fingertip can pass through it:
   back of the band (behind the fingers) → fingers → contact shadow on the skin → front of the band, side stones and the diamond (in front). */
function fingerSVG(isStatic){
  const RX = 34, RY = 11;                       // band half-width and half-height (at tilt 1)
  const g = gemTop(0, 0, 13);
  const body = (cx, w, top) => { const r = w / 2; return `M${cx - r},520 L${cx - r},${top + r} A${r},${r} 0 0 1 ${cx + r},${top + r} L${cx + r},520 Z`; };
  const crease = (cx, w, y) => `<path d="M${cx - w * .3},${y} q${w * .3},5 ${w * .6},0 M${cx - w * .21},${y + 7} q${w * .21},4 ${w * .42},0" fill="none" stroke="rgba(176,112,98,.34)" stroke-width="1.1" stroke-linecap="round"/>`;
  const finger = (cx, w, top, joints) => {
    const nw = w * .62, nh = w * .76, ny = top + 10;
    return `<path d="${body(cx, w, top)}" fill="url(#skinV)" stroke="rgba(176,112,98,.34)" stroke-width="1.2"/>
    <path d="${body(cx, w, top)}" fill="url(#fingerHi)"/>
    <rect x="${(cx - nw / 2).toFixed(1)}" y="${ny}" width="${nw.toFixed(1)}" height="${nh.toFixed(1)}" rx="${(nw * .42).toFixed(1)}" fill="url(#nailG)" stroke="rgba(214,150,160,.5)" stroke-width=".8"/>
    <path d="M${(cx - nw * .27).toFixed(1)},${(ny + nh * .72).toFixed(1)} C${(cx - nw * .34).toFixed(1)},${(ny + nh * .42).toFixed(1)} ${(cx - nw * .26).toFixed(1)},${(ny + nh * .2).toFixed(1)} ${(cx - nw * .04).toFixed(1)},${(ny + nh * .13).toFixed(1)}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    ${joints.map(d => crease(cx, w, top + d)).join('')}
    <ellipse cx="${cx}" cy="${top + joints[1] - 2}" rx="${(w * .38).toFixed(1)}" ry="12" fill="url(#knuckleHi)"/>`;
  };
  const web = (x1, x2) => `<path d="M${x1},520 L${x1},458 Q${(x1 + x2) / 2},412 ${x2},458 L${x2},520 Z" fill="url(#skinPalm)"/>`;
  const star = (c, x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path class="glint ${c}" d="M0,-13 Q1.6,-1.6 13,0 Q1.6,1.6 0,13 Q-1.6,1.6 -13,0 Q-1.6,-1.6 0,-13Z" fill="#fff"/></g>`;
  const pave = [[.62, 1.8], [.95, 1.5]].flatMap(([d, r]) => [-1, 1].map(sg => {
    const x = (sg * RX * Math.sin(d)).toFixed(1), y = (RY * Math.cos(d)).toFixed(1);
    return `<g class="pv" style="--dy:${y}px"><circle cx="${x}" cy="0" r="${r}" fill="url(#dg1)" stroke="#A9B6C9" stroke-width=".5"/><circle cx="${(x - r * .3).toFixed(1)}" cy="${-r * .3}" r="${(r * .3).toFixed(2)}" fill="#fff"/></g>`;
  })).join('');
  const arcB = `<path d="M${-RX},0 A${RX},${RY} 0 0 1 ${RX},0" fill="none" stroke="#4E5662" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
      <path d="M${-RX},0 A${RX},${RY} 0 0 1 ${RX},0" fill="none" stroke="url(#bandBack)" stroke-width="7.6" stroke-linecap="round"/>`;
  return `<svg class="fs${isStatic ? ' static' : ''}" viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="นิ้วมือข้างซ้ายสวมแหวนเพชรที่นิ้วนาง">
  <g class="rp"><g class="rb"><g class="arc ab">${arcB}</g></g></g>

  <g mask="url(#fingerFade)">
    ${web(70, 86)}${web(142, 158)}${web(218, 234)}${web(292, 314)}
    ${finger(46, 48, 210, [88, 180])}
    ${finger(114, 56, 140, [92, 192])}
    ${finger(188, 60, 108, [96, 200])}
    ${finger(263, 58, 132, [94, 196])}
    <g transform="rotate(9 345 520)">${finger(345, 62, 300, [84, 170])}</g>
  </g>

  <g clip-path="url(#ringFingerClip)"><g class="rp sh"><g class="rb">
    <g class="arc"><ellipse cx="0" cy="8" rx="33" ry="9.5" fill="url(#shadowG)" opacity=".95"/></g>
    <g class="arc"><ellipse cx="0" cy="-9" rx="31" ry="6" fill="url(#shadowG)" opacity=".5"/></g>
  </g></g></g>

  <g class="rp"><g class="rb">
    <g class="arc ab2">${arcB}</g>
    <g class="arc af">
      <path d="M${-RX},0 A${RX},${RY} 0 0 0 ${RX},0" fill="none" stroke="#4E5662" stroke-opacity=".45" stroke-width="10.4" stroke-linecap="round"/>
      <path d="M${-RX},0 A${RX},${RY} 0 0 0 ${RX},0" fill="none" stroke="url(#bandFront)" stroke-width="8" stroke-linecap="round"/>
      <path d="M${-RX + 4},-1 A${RX - 4},${RY - 1.6} 0 0 0 ${RX - 4},-1" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
    </g>
    ${pave}
    <g class="gem">${g.markup}
      <g clip-path="url(#gemClip)"><rect class="gsweep" x="-13" y="-16" width="9" height="32" fill="url(#sweepG)"/></g>
      ${star('g1', 10, -11, .9)}${star('g2', -14, 7, .65)}${star('g3', 22, 12, .55)}
    </g>
  </g></g>
  </svg>`;
}

function boxSVG(){
  return `<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="กล่องแหวนที่เปิดอยู่">
  <ellipse cx="160" cy="228" rx="132" ry="14" fill="url(#shadowG)"/>
  <path d="M66,128 L88,16 Q160,2 232,16 L254,128 Z" fill="url(#velvetG)"/>
  <path d="M80,122 L98,28 Q160,16 222,28 L240,122 Z" fill="url(#satinG)"/>
  <path d="M80,122 L98,28 Q160,16 222,28 L240,122" fill="none" stroke="#C9AE82" stroke-width="1.4"/>
  <path d="M40,132 L280,132 L290,208 Q160,236 30,208 Z" fill="url(#velvetG)"/>
  <path d="M40,132 Q160,106 280,132 Q160,152 40,132 Z" fill="#B02A42"/>
  <ellipse cx="160" cy="130" rx="104" ry="13" fill="url(#cushionG)"/>
  <path d="M112,130 Q160,137 208,130" fill="none" stroke="#2a0c14" stroke-width="6" stroke-linecap="round" opacity=".75"/>
  <g class="box-ring-in" clip-path="url(#bxClip)"><svg x="96" y="40" width="128" height="137" viewBox="0 0 300 320" overflow="visible">${ringInner(false)}</svg></g>
  <path d="M96,130 Q160,143 224,130 L224,142 Q160,156 96,142 Z" fill="#B02A42"/>
  <path d="M34,142 Q160,166 286,142" fill="none" stroke="url(#champG)" stroke-width="3"/>
  <path d="M42,134 Q160,110 278,134" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
  </svg>`;
}

/* ---------- fill the page from CONFIG ---------- */
function applyConfig(){
  document.querySelectorAll('[data-cfg]').forEach(el => { const v = CONFIG[el.dataset.cfg]; if (v != null) el.textContent = v; });

  const ringHTML = anim => CONFIG.ringImage
    ? `<img src="${CONFIG.ringImage}" alt="แหวน" style="width:100%;display:block">` : ringSVG(anim);

  document.querySelectorAll('[data-art="ring"]').forEach(el => { el.innerHTML = ringHTML(el.dataset.anim === '1'); });

  document.querySelectorAll('[data-art="finger"]').forEach(el => { el.innerHTML = fingerSVG(el.dataset.static === '1'); });
  document.querySelectorAll('[data-art="minibox"],[data-art="finalbox"]').forEach(el => { el.innerHTML = boxSVG(); });
}
</script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const state = { worn:false, busy:false, opened:false, scene:'sc-box' };
  applyConfig();                       // builds the artwork and fills every text from CONFIG

  /* ---------- timing helpers ---------- */
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const show = (sel, on = true) => { const el = typeof sel === 'string' ? $(sel) : sel; if (el) el.classList.toggle('show', on); };

  /* ---------- scale unit for every device ---------- */
  let K = 1;
  function setK(){
    K = Math.max(.6, Math.min(1.3, innerWidth / 360, innerHeight / 760));
    document.documentElement.style.setProperty('--k', K.toFixed(3));
  }
  addEventListener('resize', setK); setK();

  /* ---------- scenes ---------- */
  function go(id){
    state.scene = id;
    $$('.scene').forEach(s => s.classList.toggle('active', s.id === id));
  }

  /* ---------- sparkles (few, soft) ---------- */
  function spawn(layer, x, y, n, spread = 1){
    for (let i = 0; i < n; i++){
      const s = document.createElement('i');
      s.className = 'spark' + (Math.random() < .35 ? ' star' : '');
      s.style.left = x + '%'; s.style.top = y + '%';
      s.style.setProperty('--tx', ((Math.random() - .5) * 90 * spread).toFixed(0) + 'px');
      s.style.setProperty('--ty', (-(30 + Math.random() * 90) * spread).toFixed(0) + 'px');
      s.style.setProperty('--d', (1.3 + Math.random() * .9).toFixed(2) + 's');
      s.style.animationDelay = (Math.random() * .6).toFixed(2) + 's';
      s.addEventListener('animationend', () => s.remove());
      layer.appendChild(s);
    }
  }

  /* ---------- sound: gentle synthesized chimes, muted by default ---------- */
  let actx = null, soundOn = false, music = null;
  function ensureCtx(){
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) { try { actx = new AC(); } catch(e){} } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(freq, t0, dur, vol, type){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  function chime(notes, vol){
    if (!soundOn || !actx) return;
    const t = actx.currentTime;
    notes.forEach((f, i) => tone(f, t + i * .15, 1.3, vol || .04, 'sine'));
  }
  function tick(){ if (soundOn && actx) tone(196, actx.currentTime, .18, .05, 'triangle'); }
  function setSound(on){
    soundOn = on;
    const b = $('#sndBtn');
    b.textContent = on ? CONFIG.soundOnLabel : CONFIG.soundOffLabel;
    b.setAttribute('aria-pressed', String(on));
    if (on){ ensureCtx(); chime([880, 1318], .035); }
    if (CONFIG.backgroundMusic){
      if (on){
        if (!music){ music = new Audio(CONFIG.backgroundMusic); music.loop = true; music.volume = .25; }
        music.play().catch(() => {});
      } else if (music) music.pause();
    }
  }

  /* ---------- scene one: open the box ---------- */
  function openBox(){
    if (state.opened) return;
    state.opened = true; state.busy = true; ensureCtx();
    const box = $('#box3d'), holder = $('#boxHolder');
    box.classList.add('nudge'); tick();
    $('#btnOpen').classList.add('late');
    ['#sc-box h1', '#sc-box .sub'].forEach(s => { const el = $(s); el.style.transition = 'opacity 1.4s ease'; el.style.opacity = '0'; });
    later(() => { box.classList.remove('nudge'); box.classList.add('open'); chime([523, 659], .03); }, 550);
    later(() => { holder.classList.add('opened'); }, 1200);
    later(() => { spawn($('#sparkBox'), 50, 62, 9, 1); chime([1047, 1568], .03); }, 1700);
    later(() => { spawn($('#sparkBox'), 50, 58, 7, 1.1); }, 2500);
    later(() => { holder.classList.add('zoom'); }, 3100);
    later(() => { state.busy = false; go('sc-ring'); enterRing(); }, 4000);
  }

  /* ---------- scene two: the ring ---------- */
  function enterRing(){
    later(() => spawn($('#sparkRing'), 50, 28, 6, 1), 700);
    later(() => show('#rl1'), 1100);
    later(() => { show('#rl2'); spawn($('#sparkRing'), 50, 30, 5, .9); chime([784, 1175], .03); }, 3200);
    later(() => show('#btnToTry'), 4800);
  }

  /* ---------- scene three: try on ---------- */
  const fs = $('#fingerArt .fs');
  const holder3 = $('#fingerHolder');
  const HOME = { rx:114, ry:44, rs:1, tilt:1.7 };    // ring hovers above the left ring finger
  const SEAT_Y = 380;                                // where the ring rests at the base of the finger
  const rv = Object.assign({}, HOME);
  function setRing(o){
    Object.assign(rv, o);
    if (o.t) fs.style.setProperty('--t', o.t);
    fs.style.setProperty('--rx', rv.rx.toFixed(1) + 'px');
    fs.style.setProperty('--ry', rv.ry.toFixed(1) + 'px');
    fs.style.setProperty('--rs', rv.rs.toFixed(3));
    fs.style.setProperty('--tilt', String(rv.tilt));
  }
  function snapRing(o){            // move without animating
    fs.classList.add('snap');
    setRing(o);
    void fs.getBoundingClientRect();
    fs.classList.remove('snap');
  }

  function toTry(){ go('sc-try'); }

  function wear(){
    if (state.busy) return;
    state.busy = true; state.worn = true; tick();
    show('#actChoice', false); show('#g-q', false);
    holder3.classList.add('pose');
    fs.classList.add('moving');
    later(() => setRing({ ry: 74, tilt: 1.55, t: '1s' }), 500);          // ring lines up over the fingertip
    later(() => setRing({ ry: 156, tilt: 1.3, t: '1.5s' }), 1600);       // the fingertip passes through the band
    later(() => setRing({ ry: SEAT_Y, tilt: 1, t: '2.3s' }), 3300);      // the ring slides down to the base of the finger
    later(() => {                                                        // seated: the stone faces the viewer and catches the light
      fs.classList.add('worn');
      const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      spawn($('#sparkTry'), 27, 71, 8, .8);
      chime([1047, 1397, 1760], .035);
    }, 5700);
    later(() => { holder3.classList.remove('pose'); holder3.classList.add('zoom'); }, 6000);   // camera eases in a little
    later(() => { show('#g-worn'); show('#w1'); }, 7500);
    later(() => show('#w2'), 9300);
    later(() => { show('#certLayer'); chime([659, 988], .03); }, 11500);
  }

  function decline(){
    if (state.busy) return;
    state.busy = true; state.worn = false; tick();
    show('#actChoice', false); show('#g-q', false);
    show('#slot');
    fs.classList.add('moving', 'front');                         // the whole ring stays in front of the fingers while it travels
    setRing({ ry: 26, rs: .86, tilt: 1.9, t: '1.1s' });          // floats backward
    later(() => {                                                // then drifts to the open box
      const r = fs.getBoundingClientRect(), sl = $('#slot').getBoundingClientRect();
      const sc = (r.width / 420) || 1;
      const tx = sl.left + sl.width * .5, ty = sl.top + sl.height * (108 / 250);
      setRing({ rx: (tx - r.left) / sc, ry: (ty - r.top) / sc,
                rs: ((sl.width * .26) / sc) / 76, tilt: 1, t: '1.8s' });
    }, 1300);
    later(() => { fs.classList.add('hide'); show('#slot .box-ring-in'); chime([784, 988], .03); }, 3200);
    later(() => { show('#g-decl'); show('#d1'); }, 3700);
    later(() => show('#d2'), 5400);
    later(() => { show('#actDecl'); state.busy = false; }, 6500);
  }

  function retry(){
    if (state.busy) return;
    state.busy = true; tick();
    show('#actDecl', false); show('#g-decl', false); show('#d1', false); show('#d2', false);
    show('#slot .box-ring-in', false);                           // the ring lifts out of the box
    fs.classList.add('snap'); fs.classList.remove('hide'); void fs.getBoundingClientRect(); fs.classList.remove('snap');
    later(() => setRing({ rx: HOME.rx, ry: HOME.ry, rs: 1, tilt: HOME.tilt, t: '1.8s' }), 60);
    later(() => show('#slot', false), 1000);
    later(() => { fs.classList.remove('moving', 'front'); show('#g-q'); }, 1900);
    later(() => { show('#actChoice'); state.busy = false; }, 2400);
  }

  function keepPromise(){
    $('#cert').classList.add('leave'); tick();
    later(() => { go('sc-final'); enterFinal(); }, 1000);
  }
  function continueWithout(){
    if (state.busy) return;
    state.busy = true; tick();
    show('#actDecl', false);
    later(() => { go('sc-final'); enterFinal(); }, 500);
  }

  /* ---------- final ---------- */
  function enterFinal(){
    $('#finalHand').hidden = !state.worn;
    $('#finalBox').hidden = state.worn;
    later(() => show('#finalArt'), 400);
    later(() => show('#f0'), 1500);
    later(() => show('#f1'), 2900);
    later(() => show('#f2'), 4300);
    later(() => show('#f3'), 5900);
    later(() => show('#btnReplay'), 7400);
  }
  (function particles(){
    const layer = $('#fpLayer');
    for (let i = 0; i < 12; i++){
      const p = document.createElement('i'); p.className = 'fp';
      p.style.left = (6 + Math.random() * 88).toFixed(1) + '%';
      p.style.top = (52 + Math.random() * 42).toFixed(1) + '%';
      p.style.setProperty('--d', (8 + Math.random() * 6).toFixed(1) + 's');
      p.style.setProperty('--dl', (-Math.random() * 12).toFixed(1) + 's');
      layer.appendChild(p);
    }
  })();

  /* ---------- replay: back to scene one ---------- */
  function replay(){
    clearTimers();
    document.body.classList.add('noanim');
    state.worn = false; state.busy = false; state.opened = false;
    const box = $('#box3d'), holder = $('#boxHolder');
    box.classList.remove('open', 'nudge'); holder.classList.remove('opened', 'zoom');
    ['#sc-box h1', '#sc-box .sub'].forEach(s => { const el = $(s); el.style.transition = ''; el.style.opacity = ''; });
    show('#btnOpen', false); $('#btnOpen').classList.remove('late');
    ['#rl1', '#rl2', '#btnToTry', '#w1', '#w2', '#d1', '#d2', '#f0', '#f1', '#f2', '#f3', '#btnReplay', '#finalArt',
     '#g-worn', '#g-decl', '#slot', '#slot .box-ring-in', '#certLayer', '#actDecl'].forEach(s => show(s, false));
    show('#g-q'); show('#actChoice');
    $('#cert').classList.remove('leave');
    holder3.classList.remove('pose', 'zoom');
    $('#flash').classList.remove('go');
    fs.classList.remove('hide', 'moving', 'worn', 'front');
    snapRing(Object.assign({ t:'1.4s' }, HOME));
    $$('.spark-layer').forEach(l => { if (l.id !== 'fpLayer') l.innerHTML = ''; });
    void document.body.offsetWidth;
    go('sc-box');
    setTimeout(() => document.body.classList.remove('noanim'), 80);
  }

  /* ---------- wiring ---------- */
  $('#btnOpen').addEventListener('click', openBox);
  $('#boxHit').addEventListener('click', openBox);
  $('#btnToTry').addEventListener('click', toTry);
  $('#btnWear').addEventListener('click', wear);
  $('#btnDecline').addEventListener('click', decline);
  $('#btnRetry').addEventListener('click', retry);
  $('#btnContinue').addEventListener('click', continueWithout);
  $('#btnKeep').addEventListener('click', keepPromise);
  $('#btnReplay').addEventListener('click', replay);
  $('#sndBtn').addEventListener('click', () => setSound(!soundOn));
  if (!CONFIG.showSoundToggle) $('#sndBtn').hidden = true;
  setSound(false);
  if (CONFIG.enableSound){ addEventListener('pointerdown', function once(){ setSound(true); removeEventListener('pointerdown', once); }, { once:true }); }
  setRing({});
})();
</script>
</body></html>
